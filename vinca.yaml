ros_distro: jazzy

# mapping for package keys
conda_index:
  - robostack.yaml
  - packages-ignore.yaml

# Reminder for next full rebuild, the next build number should be 12
build_number: 10

mutex_package:
  name: "ros2-distro-mutex"
  version: "0.11.0"
  upper_bound: "x.x"
  run_constraints:
    - libboost 1.86.*
    - libboost-devel 1.86.*
    - pcl 1.15.0.*
    - gazebo 11.*
    - libprotobuf 5.29.3.*
    - libxml2 2.13.*
    - vtk 9.4.2.*

packages_skip_by_deps:
  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp


packages_remove_from_deps:
  - if: not linux
    then:
      - pendulum_control
      - rttest
      - tlsf
      - tlsf_cpp


skip_existing:
  # - output
  - https://conda.anaconda.org/robostack-jazzy/

packages_select_by_deps:
  # Bit-Bots specific pkgs that are available in ros2-gbp but not in the robostack-jazzy channel
  - imu_complementary_filter
  - soccer_vision_attribute_msgs
  - soccer_vision_3d_msgs
  - soccer_vision_3d_rviz_markers
  - rviz_imu_plugin
  - rot_conv
  - gazebo_msgs

  # Bit-Bots specific packages that need to be built from source
  - audio_common
  - audio_common_msgs
  - audio_capture
  - audio_play
  - bio_ik
  - bio_ik_msgs
  - biped_interfaces
  - bitbots_tf_buffer
  - ros2_python_extensions
  - dynamic_stack_decider
  - dynamic_stack_decider_visualization
  - bitbots_dynamixel_sdk
  - dynamixel_workbench_toolbox
  - game_controller_hl
  - game_controller_hl_interfaces
  #- hlvs_player
  - humanoid_base_footprint
  - ipm_image_node
  - ipm_interfaces
  - ipm_library
  - soccer_ipm
  - particle_filter
  - ros2_numpy
  - soccer_field_map_generator
  - udp_bridge
  - better_launch

patch_dir: patch
rosdistro_snapshot: rosdistro_snapshot.yaml
rosdistro_additional_recipes: rosdistro_additional_recipes.yaml
